name: Sync secrets and check APIs

# Checks Supabase, Resend, NOWPayments, Appwrite and Vercel keys, then pushes them to
# Supabase Edge Function secrets and Vercel Production env.
# Add these in GitHub → Settings → Secrets and variables → Actions:
#   SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_PROJECT_REF, SUPABASE_ACCESS_TOKEN,
#   RESEND_API_KEY, RESEND_FROM, NOWPAYMENTS_API_KEY, NOWPAYMENTS_IPN_SECRET,
#   APPWRITE_ENDPOINT, APPWRITE_PROJECT_ID, VERCEL_TOKEN, VERCEL_PROJECT_ID, VERCEL_ORG_ID (team projects only)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = test keys only, dry-run = show plan, push = apply'
        type: choice
        options: [push, check, dry-run]
        default: push
  push:
    branches: [main]
    paths: ['scripts/secrets-run.js', '.github/workflows/secrets-sync.yml']

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run secrets script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          NOWPAYMENTS_API_KEY: ${{ secrets.NOWPAYMENTS_API_KEY }}
          NOWPAYMENTS_IPN_SECRET: ${{ secrets.NOWPAYMENTS_IPN_SECRET }}
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VITE_AUTH_PROVIDER: supabase
          MODE: ${{ inputs.mode || 'push' }}
        run: |
          case "$MODE" in
            check) node scripts/secrets-run.js --check ;;
            dry-run) node scripts/secrets-run.js --dry-run ;;
            *) node scripts/secrets-run.js ;;
          esac
